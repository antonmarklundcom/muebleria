name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (CI check only — deploys happen via Hostinger Git import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://muebleria.com.py
          NEXT_PUBLIC_CUOTAS_BADGE: off
